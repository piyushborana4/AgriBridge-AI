version: '3.8'

services:
  agribridge-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agribridge-ai-prod
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - OPEN_METEO_API_URL=https://api.open-meteo.com/v1/forecast
      - COPERNICUS_STAC_URL=https://stac.dataspace.copernicus.eu/v1
      - SOILGRIDS_API_URL=https://rest.isric.org/soilgrids/v2.0/properties/query
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
